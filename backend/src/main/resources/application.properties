spring.application.name=gym-exercise-tracker

# MongoDB URI — must be set via MONGODB_URI environment variable on deployment
spring.data.mongodb.uri=${MONGODB_URI}

# Auto create indexes (for unique usernames, emails, etc.)
spring.data.mongodb.auto-index-creation=true

# Server port — Render/Railway inject $PORT dynamically; fallback to 8082 locally
server.port=${PORT:8082}

# JWT — secret must be set via JWT_SECRET environment variable on deployment
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS — set via env var on deployment; defaults allow local dev
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Security debug logging (disable in production)
logging.level.org.springframework.security=WARN